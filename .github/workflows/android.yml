name: Android APK

on:
  push:
    branches:
      - 'build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate PHP backend
        run: |
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l
          status=0
          for t in backend/tests/*_test.php backend/tests/schema_contract.php; do
            php "$t" || status=1
          done
          exit "$status"

      - name: Test and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: randevu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
